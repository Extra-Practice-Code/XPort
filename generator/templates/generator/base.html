{% load generator_utils going_hybrid %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block page_title %}Going Hybrid!{% endblock %}</title>
    <style>
      :root {
        --font-size: 10pt;
        --line-height: 15pt;
        --font-family: "sans-serif";
      }

      body, html {
        font-size: var(--font-size);
        line-height: var(--line-height);
        font-family: var(--font-family);
      }

      body {
        max-width: 80ch;
        margin: 1em 2em;
        display: grid;
        grid-template-rows: min-content 1fr;
      }

      header {
        display: flex;
        vertical-align: baseline;
        margin: 2em 0;
      }

      nav ul {
        list-style-type: none;
        display: flex;
        align-items: baseline;
        margin: 0;
        padding: 0;
      }

      nav ul li {
        margin: 0 2ch 0 0;
      }
    </style>
  </head>
  <body {% if page_content.content_type %}data-content-type="{{ page_content.content_type}}"{% endif %} {% if page_content.model %}data-content-model="{{ page_content.model.key }}"{% endif %}>
    <header>
      <nav id="nav">
        {% going_hybrid_navbar %}
      </nav>
      <nav id="nav--sub">{% block subnav %}{% endblock %}</nav>
    </header>
    <main>
      {% block content %}
      {% endblock %}
    </main>
  </body>
</html>
