    <link rel="stylesheet" href="{{ SITE_URL }}/generated.css" type="text/css" media="all">
  </head>
  <body {% if page_content.content_type %}data-content-type="{{ page_content.content_type}}"{% endif %} {% if page_content.model %}data-content-model="{{ page_content.model.key }}"{% endif %}>
    <header>
      <nav id="nav">
        {% going_hybrid_navbar %}
      </nav>
      <nav id="nav--sub">{% block subnav %}{% endblock %}</nav>
    </header>
    <main>
      {% block content %}
      {% endblock %}
    </main>
    <script>
      var labels = document.querySelectorAll('[data-label][data-direct-link]');
      
      for (let i = 0; i < labels.length; i++) {
        const label = labels[i];
        parent = label.parentElement;
        label = label.dataset.label;
        parent.classList.add('label--' + label.replace(/\s+/g, '-'));
      }

      var images = document.querySelectorAll('img');

      for (let i=0; i < images.length; i++) {
        if (images[i].src.endsWith(')')) {
          images[i].src = images[i].src.substring(0, images[i].src.length - 1)
        }
      }
    </script>
  </body>
