{% extends "generator/base.html" %}
{% load generator_utils %}
{% block content %}
  <h2>{{ object.contentType }} </h2>
  <h1>{{ object }}</h1>
  {% if object.content %}{{ object.content }}{% endif %}
  <ul>
    {% for other in object|merged_links %}
    <li>
      <a href="{{ other.url }}">({{ other.contentType }}) {{ other }}</a>
    </li>
    {% endfor %}
  </ul>
{% endblock %}
