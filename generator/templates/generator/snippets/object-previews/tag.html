{% load thumbnail %}
{% load generator_utils %}

<div class="item item-type--{{ object.contentType }} item--reference" data-item-object-type="{{ object.contentType }}">
  <a href="{{ object.url }}">
      <p class="item-type--tag-counter">
        {{ object|merged_targets|length }} item{{ object|merged_targets|length|pluralize }}
      </p>
      <p class="item-type--tag-title">
        <strong>{{ object.tag|capfirst }}</strong>
      </p>
  </a>
</div>
