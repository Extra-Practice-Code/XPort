{% load thumbnail %}

<div
  class="item item-type--{{ object.contentType }} item--reference"
  data-item-object-type="{{ object.contentType }}"
>
  {% thumbnail object.thumbnailPath 600x400 upscale dither="#000000" as thumb %}
  {% if object.vimeoId or object.youtubeId %}
  <iframe
    class="item--video"
    webkitallowfullscreen 
    mozallowfullscreen 
    allowfullscreen
    srcdoc="
        <style>
              body, .full {
                width: 100%;
                height: 100%;
                margin: 0;
                position: absolute;
                display: flex;
                justify-content: center;
                object-fit: contain;
              }
              .video-image-wrapper {
                background-color: #0074d9;
              }
              
              .video-image-wrapper:hover {
                background-color: #09484d 
              }

              .video-image-wrapper:hover .video-image{
                mix-blend-mode: lighten;
              }

              .video-image {
                mix-blend-mode: overlay; 
                /* image-rendering: pixelated; */
              }
        </style>
        <a
            class='full video-image-wrapper'
            href='{% if object.vimeoId %}https://player.vimeo.com/video/{{ object.vimeoId }}?autoplay=1&autopause=0{% else %}https://www.youtube-nocookie.com/embed/{{ object.youtubeId }}{% endif %}'
        >
            <img
                class='full video-image'
                src='{{ thumb.url }}'/>
            <svg
                version='1.1'
                viewBox='0 0 68 48'
                width='200px'
                style='position: relative;'
            >
                <path d='M 45,24 27,14 27,34' fill='#fff'></path>
            </svg>
        </a>"
    frameborder="0"
  >
  </iframe>

  {% else %}
  <video controls>
    <source src="{{ object.video }}" type="{{ object.type }}" />
  </video>
  {% endif %} {% if object.description %}
  <p>{{ object.description }}</p>
  {% endif %}
</div>
