<figure data-type="video" class="video--wrapper video--vimeo--wrapper">
  {% if object.thumbnail.value %}
  <div class="video--thumbnail video--vimeo--thumbnail">
    <img src="{{ object.thumbnail.value.url }}" />
  </div>
  {% endif %}
  <div class="video video--vimeo" style="padding:56.25% 0 0 0;position:relative;">
    <iframe src="https://player.vimeo.com/video/{{ object.vimeo }}?title=0&byline=0&portrait=0" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>
  {% if object.caption %}
    <figcaption>
      {{ object.caption }}
    </figcaption>
  {% endif %}
  <script src="https://player.vimeo.com/api/player.js"></script>
</figure>
