<section class="audio" id="{{ link.id }}" data-link-target-type="{{ object.contentType }}" data-link-id="{{ link.id }}">
  {% if object.title %}
    <h3>{{  object.title }}</h3>
  {% endif %}
  <audio controls>
    <source src="{{ object.audio }}" type="{{ object.type }}">
  </audio>
  {% if object.description %}
    <p>
      {{ object.description }}
    </p>
  {% endif %}
</section>
