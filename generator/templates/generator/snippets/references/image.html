<figure class="image" id="{{ link.id }}" data-link-target-type="{{ object.contentType }}" data-link-id="{{ link.id }}">
  {% if object.title %}
    <h3>{{  object.title }}</h3>
  {% endif %}
  <img src="{{ object.image }}" />
  {% if object.caption %}
    <caption>
      {{ object.caption }}
    </caption>
  {% endif %}
  </figure>
