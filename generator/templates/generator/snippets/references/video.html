<section class="video">
  {% if object.title %}
    <h3>{{  object.title }}</h3>
  {% endif %}
  {% if object.vimeoId %}
    <iframe src="https://player.vimeo.com/video/{{ video.vimeoId }}?color=ffffff&title=0&byline=0&portrait=0" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <!-- @FIXME find a way to include the player js only once -->
    <script src="https://player.vimeo.com/api/player.js"></script>
  {% else %}
    <video controls>
      <source src="{{ object.video }}" type="{{ object.type }}">
    </video>
  {% endif %}
  {% if object.description %}
    <p>
      {{ object.description }}
    </p>
  {% endif %}
</section>
