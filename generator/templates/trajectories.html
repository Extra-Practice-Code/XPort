{% extends "generator_base.html" %}
{% block content %}
  <h1>Trajectories</h1>
  <section class="trajectory-list">
    {% for trajectory in trajectories %}
      <section class="trajectory">
        <h2 class="produser">
          <a href="{{ trajectory.produser.link }}">{{ trajectory.produser }}</a>
        </h2>
        {% if trajectory.summary %}
          {{ trajectory.summary }}
        {% else %}
          {{ trajectory.content }}
        {% endif %}
      </section>
    {% endfor %}
  </section>
{% endblock %}
