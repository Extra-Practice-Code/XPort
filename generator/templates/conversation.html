{% load generator_utils %}
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" type="text/css" media="all" href="static/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oceanographies Institute</title>
</head>

<body>
  <h1>{{ conversation }}</h1>
  <dl>
    <dt>Person</dt>
    <dd>{{ conversation.person }}</dd>
    <dt>Date</dt>
    <dd>{{ conversation.date }}</dd>
    <dt>Location</dt>
    <dd><a href="{{ conversation.location.target.link }}">{{ conversation.location }}</a></dd>
  </dl>
  {{ conversation.content }}
</body>
