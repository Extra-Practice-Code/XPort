
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Produsers</title>
</head>
<body>
  {% for role, produsers in grouped_produsers %}
    <h2>{{ role }}</h2>
    {% for produser in produsers %}
      <h3><a href="produsers/{{ produser.key }}.html">{% if produser.name %}{{ produser.name }}{% else %}{{ produser.produser }}{% endif %}</a></h3>
    {% endfor %}
  {% endfor %}
</body>
</html>
