{% regroup produsers|dictsort:"role" by role as role_list %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Produsers</title>
</head>
<body>
  {% for role in role_list %}
    <h2>{{ role.grouper }}</h2>
    {% for produser in role.list %}
      <h3>{{ produser.key }}</h3>
      {{ produser.biography }}
    {% endfor %}
  {% endfor %}
  <!-- {% for produser in produsers %}
    <h2>{{ produser.key }}</h2>
    {{ produser.biography }}
  {% endfor %} -->
</body>
</html>
