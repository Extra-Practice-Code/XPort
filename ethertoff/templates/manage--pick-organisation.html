{% extends "base.html" %}

{% block extra_styles %}
    <link rel="stylesheet" href="{% url 'css-screen' %}" type="text/css" media="screen">
    <link rel="stylesheet" href="{% url 'css-print' %}" type="text/css" media="print">
{% endblock %}

{% block title %}
<h1>Select organisation</h1>
{% endblock %}

{% block content %}
    {% for organisation in organisations %}
      <p><a href="{% url 'manage' organisation.slug %}">{{ organisation.name }} ({{ organisation.slug}})</a></p>
    {% endfor %}
{% endblock %}
